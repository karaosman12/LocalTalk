<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Yerel Sohbet v5</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);color:#fff}

.login{position:fixed;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;z-index:100}
.lbox{text-align:center;background:rgba(255,255,255,.05);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.1);border-radius:24px;padding:40px;width:400px;max-width:92vw}
.lbox h1{font-size:1.7em;margin-bottom:6px}
.lbox p{color:rgba(255,255,255,.45);margin-bottom:24px;font-size:.88em}
.lbox input{width:100%;padding:14px 18px;border:2px solid rgba(255,255,255,.15);border-radius:14px;background:rgba(255,255,255,.07);color:#fff;font-size:16px;outline:none;margin-bottom:14px;-webkit-appearance:none}
.lbox input:focus{border-color:#6c63ff}
.lbox button{width:100%;padding:14px;border:none;border-radius:14px;background:linear-gradient(135deg,#6c63ff,#3f51b5);color:#fff;font-size:1em;font-weight:600;cursor:pointer}
.lerr{color:#ff5252;font-size:.82em;margin-bottom:10px;padding:8px;border-radius:10px;background:rgba(255,82,82,.1);display:none}

.app{display:none;height:100%;flex-direction:column}
.topbar{display:flex;align-items:center;padding:10px 14px;background:rgba(255,255,255,.04);border-bottom:1px solid rgba(255,255,255,.07);gap:6px;flex-shrink:0;min-height:48px;z-index:10;flex-wrap:wrap}
.topbar h2{font-size:.95em;margin-right:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{padding:3px 8px;border-radius:12px;font-size:.62em;font-weight:700}
.bh{background:rgba(255,193,7,.2);color:#ffd54f}
.bm{background:rgba(33,150,243,.2);color:#64b5f6}
.bu{background:rgba(255,255,255,.08);color:rgba(255,255,255,.4)}
.tb{padding:5px 9px;border:none;border-radius:8px;font-size:.65em;font-weight:600;cursor:pointer}
.tbs{background:rgba(76,175,80,.2);color:#81c784}
.tbc{background:rgba(255,82,82,.15);color:#ff5252}
.tbr{background:rgba(255,152,0,.15);color:#ffb74d;position:relative}
.tbr .notif{position:absolute;top:-4px;right:-4px;width:16px;height:16px;border-radius:50%;background:#ff5252;color:#fff;font-size:.6em;display:flex;align-items:center;justify-content:center;font-weight:700}

.mn{display:flex;flex:1;overflow:hidden}
.sb{width:240px;background:rgba(0,0,0,.22);border-right:1px solid rgba(255,255,255,.05);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
.sb::-webkit-scrollbar{width:3px}
.sb::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08)}
.st{color:rgba(255,255,255,.3);font-size:.62em;text-transform:uppercase;letter-spacing:1.5px;padding:10px 12px 5px}
.rl{padding:0 6px}
.ri{display:flex;align-items:center;gap:6px;padding:8px 9px;border-radius:8px;cursor:pointer;margin-bottom:2px;font-size:.8em;transition:background .15s}
.ri:hover{background:rgba(255,255,255,.04)}
.ri.act{background:rgba(108,99,255,.18)}
.ri .rn{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ri .rc{font-size:.65em;color:rgba(255,255,255,.25);background:rgba(255,255,255,.05);padding:2px 6px;border-radius:8px}
.ri .rx{font-size:.7em;color:#ff5252;cursor:pointer;opacity:0;transition:opacity .2s;padding:2px}
.ri:hover .rx{opacity:1}
.ri .rlk{font-size:.68em;color:rgba(255,193,7,.6)}
.cr{display:flex;gap:4px;padding:7px;border-top:1px solid rgba(255,255,255,.05);flex-wrap:wrap}
.cr input{flex:1;min-width:70px;padding:6px 9px;border:1px solid rgba(255,255,255,.08);border-radius:7px;background:rgba(255,255,255,.05);color:#fff;font-size:.75em;outline:none;-webkit-appearance:none}
.cr input:focus{border-color:#6c63ff}
.cr button{padding:6px 11px;border:none;border-radius:7px;background:rgba(108,99,255,.25);color:#a8a3ff;font-size:.8em;cursor:pointer}
.ul{padding:0 6px;max-height:220px;overflow-y:auto}
.ul::-webkit-scrollbar{width:3px}
.ul::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08)}
.ui{display:flex;align-items:center;gap:5px;padding:5px 7px;border-radius:6px;font-size:.75em;margin-bottom:1px}
.ui:hover{background:rgba(255,255,255,.03)}
.ud{width:6px;height:6px;border-radius:50%;background:#4caf50;box-shadow:0 0 5px rgba(76,175,80,.4);flex-shrink:0}
.un2{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:rgba(255,255,255,.6)}
.ur{font-size:.58em;padding:2px 5px;border-radius:4px;flex-shrink:0}
.ua{font-size:.58em;padding:3px 5px;border-radius:4px;cursor:pointer;border:none;flex-shrink:0}

.ch{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.che{flex:1;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.18);font-size:1em;text-align:center;padding:20px}
.ms{flex:1;overflow-y:auto;padding:12px;-webkit-overflow-scrolling:touch}
.ms::-webkit-scrollbar{width:4px}
.ms::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1)}

.mg{display:flex;flex-direction:column;margin-bottom:10px;animation:mi .25s}
@keyframes mi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.mg.me{align-items:flex-end}
.mg.ot{align-items:flex-start}
.ma{font-size:.65em;color:rgba(255,255,255,.3);margin-bottom:2px;padding:0 10px}
.mrt{font-size:.56em;padding:1px 4px;border-radius:3px;margin-left:3px}
.mb{max-width:70%;padding:10px 14px;border-radius:16px;font-size:.86em;line-height:1.4;word-wrap:break-word;position:relative}
.me .mb{background:linear-gradient(135deg,#6c63ff,#3f51b5);color:#fff;border-bottom-right-radius:4px}
.ot .mb{background:rgba(255,255,255,.09);color:rgba(255,255,255,.88);border-bottom-left-radius:4px}
.mbot{display:flex;align-items:center;gap:5px;margin-top:2px;padding:0 10px;flex-wrap:wrap}
.mt2{font-size:.6em;color:rgba(255,255,255,.2)}
.mrd{font-size:.56em;color:rgba(108,99,255,.5)}
.mcb{width:14px;height:14px;border-radius:3px;border:2px solid rgba(255,255,255,.18);cursor:pointer;flex-shrink:0;appearance:none;-webkit-appearance:none;background:transparent}
.mcb:checked{background:#6c63ff;border-color:#6c63ff}
.mrp{font-size:.58em;color:rgba(255,152,0,.5);cursor:pointer;padding:2px 4px;border-radius:4px;transition:color .2s}
.mrp:hover{color:#ff9800}

.mimg{max-width:100%;max-height:260px;border-radius:10px;cursor:pointer;display:block;margin-top:4px}
.mvid{max-width:100%;max-height:260px;border-radius:10px;display:block;margin-top:4px}
.mfile{display:flex;align-items:center;gap:8px;padding:6px 0}
.mfile-icon{font-size:1.4em}
.mfile-info{flex:1;min-width:0}
.mfile-name{font-size:.82em;word-break:break-all}
.mfile-size{font-size:.68em;color:rgba(255,255,255,.4)}
.mfile-dl{padding:6px 12px;border:none;border-radius:8px;background:rgba(255,255,255,.15);color:#fff;font-size:.75em;cursor:pointer;text-decoration:none;flex-shrink:0;display:inline-block}
.mfile-dl:hover{background:rgba(255,255,255,.25)}

.sys2{text-align:center;color:rgba(255,255,255,.2);font-size:.7em;margin:5px 0;font-style:italic}
.typ{padding:0 12px 3px;color:rgba(255,255,255,.25);font-size:.7em;height:16px;font-style:italic;flex-shrink:0}

.dlb{display:none;padding:7px 12px;background:rgba(255,82,82,.08);border-top:1px solid rgba(255,82,82,.12);align-items:center;gap:7px;flex-shrink:0}
.dlb.show{display:flex}
.dlb .dcc{color:#ff5252;font-size:.78em;font-weight:600;flex:1}
.dlb .dbb{padding:6px 12px;border:none;border-radius:7px;font-size:.72em;font-weight:600;cursor:pointer}
.dbc{background:rgba(255,255,255,.08);color:rgba(255,255,255,.5)}
.dbd{background:rgba(255,82,82,.25);color:#ff5252}

.ia{display:none;gap:7px;padding:10px 12px;background:rgba(0,0,0,.18);border-top:1px solid rgba(255,255,255,.05);align-items:center;flex-shrink:0}
.ia.show{display:flex!important}
.ia input[type=text]{flex:1;padding:12px 14px;border:2px solid rgba(255,255,255,.08);border-radius:14px;background:rgba(255,255,255,.05);color:#fff;font-size:16px;outline:none;min-width:0;-webkit-appearance:none}
.ia input[type=text]:focus{border-color:#6c63ff}
.snd{padding:12px 20px;border:none;border-radius:14px;background:linear-gradient(135deg,#6c63ff,#3f51b5);color:#fff;font-size:1.1em;cursor:pointer;flex-shrink:0}

.fb2{width:42px;height:42px;border-radius:50%;border:2px solid rgba(76,175,80,.3);background:rgba(76,175,80,.1);color:#81c784;font-size:1.05em;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative;overflow:hidden}
.fb2 input{position:absolute;top:0;left:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
.fb3{width:42px;height:42px;border-radius:50%;border:2px solid rgba(33,150,243,.3);background:rgba(33,150,243,.1);color:#64b5f6;font-size:1.05em;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative;overflow:hidden}
.fb3 input{position:absolute;top:0;left:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}

.fso{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.88);z-index:9998;display:none;align-items:center;justify-content:center;cursor:pointer}
.fso.show{display:flex}
.fso img{max-width:95vw;max-height:92vh;border-radius:8px;object-fit:contain}

.tt{position:fixed;top:14px;right:14px;padding:10px 18px;border-radius:11px;color:#fff;font-size:.78em;font-weight:500;z-index:9999;animation:ti .4s;max-width:300px}
.tt.error{background:rgba(255,82,82,.88)}
.tt.success{background:rgba(76,175,80,.88)}
.tt.info{background:rgba(108,99,255,.88)}
@keyframes ti{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:translateX(0)}}
@keyframes to2{from{opacity:1}to{opacity:0;transform:translateX(60px)}}

.ov{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.55);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:10000}
.ov.show{display:flex}
.pop{background:#1a1a2e;border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:24px;text-align:center;width:440px;max-width:92vw;max-height:85vh;overflow-y:auto}
.pop::-webkit-scrollbar{width:4px}
.pop::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1)}
.pop h3{margin-bottom:8px;font-size:1em}
.pop p{color:rgba(255,255,255,.4);margin-bottom:14px;font-size:.8em}
.pop input,.pop textarea{width:100%;padding:10px 12px;border:2px solid rgba(255,255,255,.1);border-radius:10px;background:rgba(255,255,255,.06);color:#fff;font-size:.85em;outline:none;margin-bottom:10px;-webkit-appearance:none;font-family:inherit}
.pop textarea{resize:vertical;min-height:60px}
.pop input:focus,.pop textarea:focus{border-color:#6c63ff}
.pbns{display:flex;gap:8px}
.pbns button{flex:1;padding:10px;border:none;border-radius:10px;font-size:.82em;font-weight:600;cursor:pointer}
.pc2{background:rgba(255,255,255,.08);color:rgba(255,255,255,.5)}
.pd2{background:linear-gradient(135deg,#6c63ff,#3f51b5);color:#fff}
.pdng{background:linear-gradient(135deg,#ff5252,#d32f2f);color:#fff}

/* SIKAYET KARTI */
.rcard{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:14px;margin-bottom:10px;text-align:left}
.rcard-user{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.rcard-avatar{width:32px;height:32px;border-radius:50%;background:rgba(255,82,82,.15);display:flex;align-items:center;justify-content:center;font-size:.85em;flex-shrink:0}
.rcard-name{font-size:.88em;font-weight:600;color:#fff}
.rcard-ip{font-size:.68em;color:rgba(255,255,255,.3)}
.rcard-msg{background:rgba(255,255,255,.04);border-left:3px solid rgba(108,99,255,.4);padding:8px 12px;border-radius:0 8px 8px 0;margin-bottom:8px;font-size:.82em;color:rgba(255,255,255,.7);word-break:break-all}
.rcard-reason{font-size:.78em;color:rgba(255,152,0,.7);margin-bottom:8px;padding:6px 10px;background:rgba(255,152,0,.06);border-radius:8px}
.rcard-reason b{color:rgba(255,152,0,.9)}
.rcard-date{font-size:.68em;color:rgba(255,255,255,.25);margin-bottom:8px}
.rcard-ban{width:100%;padding:10px;border:none;border-radius:10px;background:linear-gradient(135deg,#ff5252,#d32f2f);color:#fff;font-size:.85em;font-weight:600;cursor:pointer;transition:transform .2s,box-shadow .2s}
.rcard-ban:hover{transform:scale(1.02);box-shadow:0 4px 15px rgba(255,82,82,.3)}
.rcard-ban:disabled{opacity:.4;cursor:default;transform:none;box-shadow:none}
.rcard-banned{width:100%;padding:10px;border:none;border-radius:10px;background:rgba(255,82,82,.1);color:rgba(255,82,82,.5);font-size:.85em;font-weight:600;text-align:center}

@media(max-width:800px){
    .sb{position:fixed;top:48px;left:-100%;width:270px;height:calc(100% - 48px);z-index:50;transition:left .3s ease}
    .sb.open{left:0}
    .sbb{position:fixed;top:48px;left:0;width:100%;height:calc(100% - 48px);background:rgba(0,0,0,.4);z-index:49;display:none}
    .sbb.show{display:block}
    .mbtn{display:flex!important}
    .mb{max-width:85%}
}
.mbtn{display:none;width:34px;height:34px;border:none;border-radius:8px;background:rgba(255,255,255,.08);color:#fff;font-size:1.1em;cursor:pointer;align-items:center;justify-content:center;flex-shrink:0}
</style>
</head>
<body>

<div class="login" id="LS"><div class="lbox">
    <h1>Yerel Sohbet</h1><p>v5.0</p>
    <div class="lerr" id="LE"></div>
    <input type="text" id="NI" placeholder="Kullanici adiniz..." maxlength="20" autocomplete="off">
    <button onclick="doJoin()">Katıl</button>
</div></div>

<div class="app" id="APP">
<div class="topbar">
    <button class="mbtn" onclick="tSB()">&#9776;</button>
    <h2 id="RT">Oda Secin</h2>
    <span class="badge" id="MBG"></span>
    <button class="tb tbs" id="SVB" style="display:none" onclick="S.emit('manual-save')">Kaydet</button>
    <button class="tb tbc" id="CLB" style="display:none" onclick="showPop('clear')">Sifirla</button>
    <button class="tb tbr" id="RPB" style="display:none" onclick="openReports()">Sikayetler<span class="notif" id="RPCNT" style="display:none">0</span></button>
</div>
<div class="sbb" id="SBB" onclick="cSB()"></div>
<div class="mn">
<div class="sb" id="SBR">
    <div class="st">ODALAR</div>
    <div class="rl" id="RL"></div>
    <div class="cr" id="CRD" style="display:none">
        <input type="text" id="CRI" placeholder="Oda adi..." maxlength="30" autocomplete="off">
        <input type="text" id="CRP" placeholder="Sifre" maxlength="30" autocomplete="off" style="max-width:80px">
        <button onclick="crRoom()">+</button>
    </div>
    <div class="st">ODADAKILER</div>
    <div class="ul" id="RU"></div>
    <div class="st" style="border-top:1px solid rgba(255,255,255,.05)">KULLANICILAR</div>
    <div class="ul" id="AU"></div>
</div>
<div class="ch">
    <div class="che" id="CE">Bir oda secin</div>
    <div class="ms" id="MS" style="display:none"></div>
    <div class="typ" id="TP"></div>
    <div class="dlb" id="DLB"><span class="dcc" id="DC">0</span><button class="dbb dbc" onclick="canDel()">Iptal</button><button class="dbb dbd" onclick="doDel()">Sil</button></div>
    <div class="ia" id="IA">
        <div class="fb2" title="Foto/Video (30MB)">&#128247;<input type="file" accept="image/*,video/mp4,video/webm,video/mov" onchange="onMedia(this)"></div>
        <div class="fb3" title="Dosya (30MB)">&#128196;<input type="file" onchange="onFileUp(this)"></div>
        <input type="text" id="MI" placeholder="Mesaj yazin..." autocomplete="off">
        <button class="snd" onclick="sendMsg()">&#10148;</button>
    </div>
</div>
</div>
</div>

<div class="fso" id="FSO" onclick="this.classList.remove('show')"><img id="FSI"></div>

<div class="ov" id="OV"><div class="pop" id="POP">
    <h3 id="PT"></h3><p id="PP"></p><div id="PEX"></div>
    <div class="pbns" id="PBNS"><button class="pc2" onclick="hidePop()">Iptal</button><button class="pd2" id="PA" onclick="doPop()">Tamam</button></div>
</div></div>

<script src="/socket.io/socket.io.js"></script>
<script>
var S=io(),me='',myRole='user',curRoom=null;
var delMode=false,selM=new Set(),popAct=null;
var typU=new Set(),typTO=null;
var pendingReports=0;

// ===== LOGIN =====
document.getElementById('NI').onkeypress=function(e){if(e.key==='Enter')doJoin()};
function doJoin(){var n=document.getElementById('NI').value.trim();if(!n){lErr('Isim bos!');return}me=n;S.emit('join',me)}
S.on('join-error',function(m){lErr(m);me=''});
S.on('banned',function(m){document.body.innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100vh;text-align:center;color:#ff5252;font-size:1.2em;padding:20px">&#128683; '+m+'</div>'});
function lErr(m){var e=document.getElementById('LE');e.textContent=m;e.style.display='block';setTimeout(function(){e.style.display='none'},3e3)}

S.on('join-success',function(d){
    me=d.username;myRole=d.role;
    document.getElementById('LS').style.display='none';
    document.getElementById('APP').style.display='flex';
    uBdg();renRooms(d.rooms);renAll(d.onlineUsers);
    if(myRole==='host'){
        document.getElementById('SVB').style.display='';
        document.getElementById('CRD').style.display='flex';
        document.getElementById('RPB').style.display='';
        S.emit('get-reports');
    }
});

// ===== SIDEBAR =====
function tSB(){document.getElementById('SBR').classList.toggle('open');document.getElementById('SBB').classList.toggle('show')}
function cSB(){document.getElementById('SBR').classList.remove('open');document.getElementById('SBB').classList.remove('show')}

// ===== ROOMS =====
function renRooms(l){
    var h='';
    for(var i=0;i<l.length;i++){
        var r=l[i],ac=r.id===curRoom?' act':'';
        h+='<div class="ri'+ac+'" onclick="joinR(\''+r.id+'\')">';
        h+='<span style="color:rgba(255,255,255,.25)">#</span><span class="rn">'+esc(r.name)+'</span>';
        if(r.hasPassword) h+='<span class="rlk">&#128274;</span>';
        h+='<span class="rc">'+r.userCount+'</span>';
        if(myRole==='host'&&r.id!=='genel') h+='<span class="rx" onclick="event.stopPropagation();showPop(\'delroom\',\''+r.id+'\')">&#10005;</span>';
        h+='</div>';
    }
    document.getElementById('RL').innerHTML=h;
}
function joinR(id){S.emit('join-room',{roomId:id,password:null});cSB()}
function crRoom(){
    var n=document.getElementById('CRI').value.trim(),p=document.getElementById('CRP').value.trim();
    if(!n){toast('Oda adi!','error');return}
    S.emit('create-room',{name:n,password:p||null});
    document.getElementById('CRI').value='';document.getElementById('CRP').value='';
}
document.getElementById('CRI').onkeypress=function(e){if(e.key==='Enter')crRoom()};
S.on('rooms-update',function(l){renRooms(l)});

S.on('need-password',function(d){
    showPop('password',d.roomId);
    document.getElementById('PT').textContent=d.roomName;
    document.getElementById('PP').textContent='Bu oda sifreli:';
    document.getElementById('PEX').innerHTML='<input type="password" id="RPINP" placeholder="Sifre...">';
    document.getElementById('PA').textContent='Giris';
    setTimeout(function(){var i=document.getElementById('RPINP');if(i)i.focus()},100);
});

S.on('room-joined',function(d){
    curRoom=d.roomId;
    document.getElementById('RT').textContent='# '+d.roomName+(d.hasPassword?' &#128274;':'');
    document.getElementById('CE').style.display='none';
    document.getElementById('MS').style.display='block';
    document.getElementById('IA').classList.add('show');
    if(myRole==='host') document.getElementById('CLB').style.display='';

    var c=document.getElementById('MS');c.innerHTML='';
    var unr=[],cm=d.myRole==='host'||d.myRole==='mod';
    for(var i=0;i<d.messages.length;i++){
        renMsg(d.messages[i],cm);
        if(!d.messages[i].readBy||d.messages[i].readBy.indexOf(me)===-1) unr.push(d.messages[i].id);
    }
    c.scrollTop=c.scrollHeight;
    if(unr.length>0)S.emit('mark-read',unr);
    renRU(d.users);

    var items=document.querySelectorAll('.ri');
    for(var j=0;j<items.length;j++){items[j].classList.remove('act');if((items[j].getAttribute('onclick')||'').indexOf("'"+d.roomId+"'")!==-1)items[j].classList.add('act')}
});

S.on('kicked-from-room',function(m){
    curRoom=null;document.getElementById('CE').style.display='flex';document.getElementById('MS').style.display='none';
    document.getElementById('IA').classList.remove('show');document.getElementById('RT').textContent='Oda Secin';toast(m,'info');
});

// ===== MESSAGES =====
function renMsg(d,cm){
    var c=document.getElementById('MS'),mine=d.username===me;
    var div=document.createElement('div');div.className='mg '+(mine?'me':'ot');div.setAttribute('data-id',d.id);
    var h='';

    if(!mine){
        var rt='';
        if(d.role==='host') rt='<span class="mrt" style="background:rgba(255,193,7,.15);color:#ffd54f">YNT</span>';
        else if(d.role==='mod') rt='<span class="mrt" style="background:rgba(33,150,243,.15);color:#64b5f6">MOD</span>';
        h+='<div class="ma">'+esc(abbr(d.username))+rt+'</div>';
    }

    if(d.type==='image'&&d.mediaFile){
        h+='<div class="mb"><img class="mimg" src="/medya/'+d.mediaFile+'" onclick="showFS(this.src)" loading="lazy"><div style="font-size:.68em;color:rgba(255,255,255,.3);margin-top:2px">'+d.fileSize+'</div></div>';
    } else if(d.type==='video'&&d.mediaFile){
        h+='<div class="mb"><video class="mvid" controls playsinline preload="metadata"><source src="/medya/'+d.mediaFile+'" type="'+(d.mediaType||'video/mp4')+'"></video><div style="font-size:.68em;color:rgba(255,255,255,.3);margin-top:2px">'+d.fileSize+'</div></div>';
    } else if(d.type==='file'&&d.savedFile){
        h+='<div class="mb"><div class="mfile"><span class="mfile-icon">&#128196;</span><div class="mfile-info"><div class="mfile-name">'+esc(d.fileName||'dosya')+'</div><div class="mfile-size">'+d.fileSize+'</div></div><a class="mfile-dl" href="/dosya/'+d.savedFile+'?name='+encodeURIComponent(d.fileName||'dosya')+'" download>Indir</a></div></div>';
    } else {
        h+='<div class="mb">'+esc(d.message||'')+'</div>';
    }

    h+='<div class="mbot">';
    if(cm&&delMode) h+='<input type="checkbox" class="mcb" data-id="'+d.id+'" onchange="tSel(this)">';
    h+='<span class="mt2">'+d.time+'</span>';
    if(mine) h+='<span class="mrd" id="rd-'+d.id+'">'+rdTxt(d.readBy||[])+'</span>';
    if(!mine) h+='<span class="mrp" onclick="reportMsg(\''+d.id+'\')" title="Sikayet et">&#9888;</span>';
    h+='</div>';

    div.innerHTML=h;c.appendChild(div);
}

function sendMsg(){
    var inp=document.getElementById('MI'),m=inp.value.trim();
    if(!m)return;if(!curRoom){toast('Oda secin!','error');return}
    S.emit('send-message',{message:m});S.emit('stop-typing');inp.value='';inp.focus();
}
document.getElementById('MI').onkeypress=function(e){if(e.key==='Enter')sendMsg()};
document.getElementById('MI').addEventListener('input',function(){S.emit('typing');clearTimeout(typTO);typTO=setTimeout(function(){S.emit('stop-typing')},1500)});

S.on('new-message',function(d){var cm=myRole==='host'||myRole==='mod';renMsg(d,cm);var c=document.getElementById('MS');c.scrollTop=c.scrollHeight;if(d.username!==me)S.emit('mark-read',[d.id])});
S.on('read-update',function(u){for(var i=0;i<u.length;i++){var el=document.getElementById('rd-'+u[i].id);if(el)el.textContent=rdTxt(u[i].readBy)}});
S.on('room-cleared',function(d){document.getElementById('MS').innerHTML='';addSys(d.by+' mesajlari sifirladi')});
S.on('messages-deleted',function(d){for(var i=0;i<d.ids.length;i++){var el=document.querySelector('[data-id="'+d.ids[i]+'"]');if(el)el.remove()}addSys(d.by+' '+d.count+' mesaj sildi');canDel()});

// ===== FILE UPLOADS =====
function onMedia(inp){
    if(!inp.files||!inp.files[0])return;if(!curRoom){toast('Oda secin!','error');inp.value='';return}
    var f=inp.files[0],mb=f.size/1048576;
    if(mb>30){toast('Max 30MB! ('+mb.toFixed(1)+'MB)','error');inp.value='';return}
    if(f.type.indexOf('image/')!==0&&f.type.indexOf('video/')!==0){toast('Sadece resim/video!','error');inp.value='';return}
    toast('Gonderiliyor...','info');
    var r=new FileReader();r.onloadend=function(){S.emit('send-media',{file:r.result,fileType:f.type,fileName:f.name})};r.readAsDataURL(f);inp.value='';
}

function onFileUp(inp){
    if(!inp.files||!inp.files[0])return;if(!curRoom){toast('Oda secin!','error');inp.value='';return}
    var f=inp.files[0],mb=f.size/1048576;
    if(mb>30){toast('Max 30MB! ('+mb.toFixed(1)+'MB)','error');inp.value='';return}
    toast('Dosya gonderiliyor...','info');
    var r=new FileReader();r.onloadend=function(){S.emit('send-file',{file:r.result,fileType:f.type,fileName:f.name})};r.readAsDataURL(f);inp.value='';
}

function showFS(src){document.getElementById('FSI').src=src;document.getElementById('FSO').classList.add('show')}

// ===== SIKAYET GONDER =====
function reportMsg(msgId){
    showPop('report',msgId);
    document.getElementById('PT').textContent='Mesaji Sikayet Et';
    document.getElementById('PP').textContent='Sikayet nedeninizi yazin:';
    document.getElementById('PEX').innerHTML='<textarea id="RPREASON" placeholder="Neden..." rows="3"></textarea>';
    document.getElementById('PA').textContent='Sikayet Et';
    document.getElementById('PA').className='pdng';
    document.getElementById('PA').style.display='';
}

// =========================================
//  HOST: SIKAYET PANELI (SADELEŞTIRILMIŞ)
// =========================================
function openReports(){
    S.emit('get-reports');
}

S.on('reports-list', function(list){
    // Bekleyen sikayet sayisi
    pendingReports = 0;
    for(var k=0;k<list.length;k++){
        if(list[k].status === 'beklemede') pendingReports++;
    }
    updateReportBadge();

    // Popup ac
    showPop('reports-view');
    document.getElementById('PT').textContent = 'Sikayetler (' + pendingReports + ' beklemede)';
    document.getElementById('PP').textContent = '';
    document.getElementById('PA').style.display = 'none';

    var h = '';

    if(list.length === 0){
        h = '<div style="text-align:center;padding:30px;color:rgba(255,255,255,.25)">Henuz sikayet yok</div>';
    }

    // Yeniden eskiye sirala
    for(var i = list.length - 1; i >= 0; i--){
        var r = list[i];
        var isBanned = false;

        // Zaten banlı mı kontrol et
        if(r.status === 'engellendi') isBanned = true;

        h += '<div class="rcard">';

        // Sikayet edilen kisi
        h += '<div class="rcard-user">';
        h += '<div class="rcard-avatar">&#128100;</div>';
        h += '<div>';
        h += '<div class="rcard-name">' + esc(r.targetUser) + '</div>';
        h += '<div class="rcard-ip">IP: ' + esc(r.targetIP) + '</div>';
        h += '</div>';
        h += '</div>';

        // Sikayet edilen mesaj
        h += '<div class="rcard-msg">' + esc(r.messageContent) + '</div>';

        // Sikayet sebebi
        h += '<div class="rcard-reason"><b>Sebep:</b> ' + esc(r.reason) + '</div>';

        // Tarih
        h += '<div class="rcard-date">' + esc(r.date) + '</div>';

        // Engelle butonu veya durum
        if(isBanned){
            h += '<div class="rcard-banned">&#128683; Engellendi</div>';
        } else if(r.status === 'beklemede'){
            h += '<button class="rcard-ban" onclick="banUser(\'' + esc(r.targetIP) + '\',\'' + esc(r.id) + '\')">&#128683; Engelle (' + esc(r.targetIP) + ')</button>';
        } else {
            h += '<div class="rcard-banned">&#10003; Incelendi</div>';
        }

        h += '</div>';
    }

    document.getElementById('PEX').innerHTML = h;
});

function banUser(ip, reportId){
    S.emit('ban-ip', { ip: ip });
    S.emit('resolve-report', { reportId: reportId, action: 'engellendi' });
    toast(ip + ' engellendi!', 'error');
    // Listeyi guncelle
    setTimeout(function(){ S.emit('get-reports'); }, 500);
}

function updateReportBadge(){
    var el = document.getElementById('RPCNT');
    if(pendingReports > 0){
        el.textContent = pendingReports;
        el.style.display = 'flex';
    } else {
        el.style.display = 'none';
    }
}

// Yeni sikayet geldiginde badge guncelle
S.on('new-report', function(r){
    pendingReports++;
    updateReportBadge();
    toast('Yeni sikayet: ' + r.targetUser, 'error');
});

// ===== DELETE =====
function enterDel(){
    delMode=true;selM.clear();document.getElementById('DLB').classList.add('show');uDC();
    var bots=document.querySelectorAll('.mbot');
    for(var i=0;i<bots.length;i++){var p=bots[i].closest('.mg');if(!p)continue;var id=p.getAttribute('data-id');
    if(id&&!bots[i].querySelector('.mcb')){var cb=document.createElement('input');cb.type='checkbox';cb.className='mcb';cb.setAttribute('data-id',id);cb.onchange=function(){tSel(this)};bots[i].insertBefore(cb,bots[i].firstChild)}}
}
function canDel(){delMode=false;selM.clear();document.getElementById('DLB').classList.remove('show');var cbs=document.querySelectorAll('.mcb');for(var i=0;i<cbs.length;i++)cbs[i].remove()}
function tSel(cb){var id=cb.getAttribute('data-id');if(cb.checked)selM.add(id);else selM.delete(id);uDC()}
function uDC(){document.getElementById('DC').textContent=selM.size+' secili'}
function doDel(){if(selM.size===0){toast('Mesaj secin!','error');return}S.emit('delete-messages',{ids:Array.from(selM)})}

// ===== USERS =====
function renRU(l){
    var h='';for(var i=0;i<l.length;i++){var u=l[i];
    h+='<div class="ui"><div class="ud"></div><div class="un2">'+esc(u.name)+(u.name===me?' (sen)':'')+'</div>';
    if(u.role==='host') h+='<span class="ur" style="background:rgba(255,193,7,.1);color:#ffd54f">YNT</span>';
    else if(u.role==='mod') h+='<span class="ur" style="background:rgba(33,150,243,.1);color:#64b5f6">MOD</span>';
    h+='</div>';}
    document.getElementById('RU').innerHTML=h;
}

function renAll(l){
    var h='';for(var i=0;i<l.length;i++){var u=l[i];
    h+='<div class="ui"><div class="ud"></div><div class="un2">'+esc(u.name)+(u.name===me?' (sen)':'')+'</div>';
    if(u.role==='host') h+='<span class="ur" style="background:rgba(255,193,7,.1);color:#ffd54f">YNT</span>';
    else if(u.role==='mod'){
        h+='<span class="ur" style="background:rgba(33,150,243,.1);color:#64b5f6">MOD</span>';
        if(myRole==='host'&&u.name!==me) h+='<button class="ua" style="background:rgba(255,82,82,.1);color:#ff5252" onclick="S.emit(\'remove-mod\',{username:\''+esc(u.name)+'\'})">-Mod</button>';
    } else {
        if(myRole==='host'&&u.name!==me) h+='<button class="ua" style="background:rgba(33,150,243,.1);color:#64b5f6" onclick="S.emit(\'set-mod\',{username:\''+esc(u.name)+'\'})">+Mod</button>';
    }
    h+='</div>';}

    if(myRole==='host'||myRole==='mod'){
        h+='<div style="padding:6px 4px;border-top:1px solid rgba(255,255,255,.04);margin-top:4px">';
        h+='<button class="ua" style="background:rgba(255,82,82,.1);color:#ff5252;width:100%;padding:6px;border-radius:6px;font-size:.68em" onclick="enterDel()">Mesaj Silme Modu</button></div>';
    }
    document.getElementById('AU').innerHTML=h;
}

S.on('users-update',function(l){renAll(l)});
S.on('room-user-joined',function(d){addSys(d.username+' katildi');renRU(d.users)});
S.on('room-user-left',function(d){addSys(d.username+' ayrildi');renRU(d.users)});

// ===== ROLE =====
S.on('role-changed',function(d){
    myRole=d.role;uBdg();
    if(myRole==='host'){
        document.getElementById('SVB').style.display='';
        document.getElementById('CLB').style.display='';
        document.getElementById('CRD').style.display='flex';
        document.getElementById('RPB').style.display='';
        S.emit('get-reports');
    }
    toast('Rol: '+(myRole==='host'?'Yonetici':myRole==='mod'?'Moderator':'Kullanici'),'info');
});
function uBdg(){var b=document.getElementById('MBG');if(myRole==='host'){b.className='badge bh';b.textContent='YNT'}else if(myRole==='mod'){b.className='badge bm';b.textContent='MOD'}else{b.className='badge bu';b.textContent=''}}

// ===== POPUP =====
S.on('save-status',function(d){toast(d.auto?'Oto kaydedildi':'Kaydedildi!','success')});

function showPop(type,extra){
    popAct={type:type,extra:extra};
    document.getElementById('PEX').innerHTML='';
    document.getElementById('PA').style.display='';
    document.getElementById('PA').className='pd2';
    document.getElementById('PA').textContent='Tamam';

    if(type==='clear'){document.getElementById('PT').textContent='Sifirla';document.getElementById('PP').textContent='Tum mesajlar silinecek.';document.getElementById('PA').className='pdng'}
    else if(type==='delroom'){document.getElementById('PT').textContent='Oda Sil';document.getElementById('PP').textContent='Oda silinecek.';document.getElementById('PA').className='pdng'}
    document.getElementById('OV').classList.add('show');
}
function hidePop(){document.getElementById('OV').classList.remove('show');popAct=null}
function doPop(){
    if(!popAct){hidePop();return}
    if(popAct.type==='clear') S.emit('clear-room',curRoom);
    else if(popAct.type==='delroom') S.emit('delete-room',popAct.extra);
    else if(popAct.type==='password'){var i=document.getElementById('RPINP');S.emit('join-room',{roomId:popAct.extra,password:i?i.value.trim():''})}
    else if(popAct.type==='report'){var r=document.getElementById('RPREASON');if(!r||!r.value.trim()){toast('Neden yazin!','error');return}S.emit('report-message',{msgId:popAct.extra,reason:r.value.trim()})}
    hidePop();
}

// ===== TYPING =====
S.on('user-typing',function(u){typU.add(u);uTyp()});
S.on('user-stop-typing',function(u){typU.delete(u);uTyp()});
function uTyp(){var el=document.getElementById('TP'),a=Array.from(typU);if(!a.length)el.textContent='';else el.textContent=a.join(', ')+' yaziyor...'}

// ===== TOASTS =====
S.on('msg-error',function(m){toast(m,'error')});
S.on('msg-success',function(m){toast(m,'success')});
S.on('system-toast',function(d){toast(d.text,d.type)});
S.on('system-message',function(d){addSys(d.text)});

// ===== HELPERS =====
function addSys(t){var c=document.getElementById('MS');if(!c)return;var d=document.createElement('div');d.className='sys2';d.textContent='- '+t+' -';c.appendChild(d);c.scrollTop=c.scrollHeight}
function rdTxt(rb){var r=[];for(var i=0;i<rb.length;i++)if(rb[i]!==me)r.push(rb[i]);if(!r.length)return'gonderildi';var s=[];for(var j=0;j<r.length&&j<3;j++)s.push(abbr(r[j]));return s.join(', ')+(r.length>3?' +'+(r.length-3):'')+' gordu'}
function abbr(n){if(!n)return'?';n=n.trim();return n.length<=3?n:n.substring(0,2)+'.'}
function esc(t){var d=document.createElement('div');d.textContent=t;return d.innerHTML}
function toast(m,type){var t=document.createElement('div');t.className='tt '+(type||'info');t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.style.animation='to2 .4s forwards';setTimeout(function(){t.remove()},400)},3e3)}
</script>
</body>
</html>
