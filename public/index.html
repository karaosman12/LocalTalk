        <div class="replybar" id="RBAR"><span>&#8617;</span><span class="rb-text" id="RBTXT"></span><span class="rb-close" onclick="cancelReply()">&#10005;</span></div>

<script>
var S=io(),me='',myRole='user',myUid='',curRoom=null,delMode=false,selM=new Set(),popAct=null,typU=new Set(),typTO=null,pendR=0;
var replyTo=null,isDark=true,muteTimer=null,activeDM=null;
var roomsCache=[],curPins=[],curPolls=[],myMentions=[],newMsgCount=0,isAtBottom=true;

var EMOJIS=['😀','😂','😍','😎','🤔','😢','😡','👍','👎','❤️','🔥','🎉','👋','🙏','💪','💀','👀','⭐','⚡','🎮','🚀','💻','✅','❌','⚠️','🔔','📌'];
document.getElementById('EMOP').innerHTML=EMOJIS.map(function(e){return'<span onclick="insertEmo(\''+e+'\')">'+e+'</span>'}).join('');

function setupScroll(){var ms=document.getElementById('MS');ms.addEventListener('scroll',function(){isAtBottom=ms.scrollHeight-ms.scrollTop-ms.clientHeight<80;if(isAtBottom)newMsgCount=0;updSB()})}
function updSB(){var b=document.getElementById('SCBTN'),c=document.getElementById('SCNT');if(!isAtBottom){b.classList.add('show');if(newMsgCount>0){c.textContent=newMsgCount;c.classList.add('show')}else c.classList.remove('show')}else{b.classList.remove('show');c.classList.remove('show')}}
function scrollBottom(){var ms=document.getElementById('MS');ms.scrollTop=ms.scrollHeight;newMsgCount=0;isAtBottom=true;updSB()}

fetch('/api/identity').then(function(r){return r.json()}).then(function(d){if(d.registered&&d.name){me=d.name;myUid=d.uid;document.getElementById('NI').style.display='none';document.getElementById('LW').style.display='block';document.getElementById('LW').textContent='Hosgeldin, '+d.name+'!';document.getElementById('LBTN').textContent='Giris Yap';document.getElementById('LBTN').onclick=function(){S.emit('join')}}}).catch(function(){});
if('Notification' in window)Notification.requestPermission();
document.addEventListener('paste',function(e){if(!curRoom)return;var items=e.clipboardData&&e.clipboardData.items;if(!items)return;for(var i=0;i<items.length;i++){if(items[i].type.indexOf('image')!==-1){var blob=items[i].getAsFile();if(!blob)continue;var r=new FileReader();r.onloadend=function(){S.emit('send-media',{file:r.result,fileType:blob.type,fileName:'paste.png',replyTo:replyTo?replyTo.id:null});cancelReply()};r.readAsDataURL(blob);e.preventDefault();break}}});
document.addEventListener('keydown',function(e){if(e.key==='Escape'){hidePop();closeDM();cancelReply();canDel();document.getElementById('EMOP').classList.remove('show');document.getElementById('SBAR').classList.remove('show');document.getElementById('STSEL').classList.remove('show')}});
document.getElementById('NI').onkeypress=function(e){if(e.key==='Enter'){if(document.getElementById('NI').style.display!=='none')doReg();else S.emit('join')}};

function doReg(){var n=document.getElementById('NI').value.trim();if(!n){lErr('Isim!');return}S.emit('register-name',n)}
S.on('join-error',function(m){lErr(m)});S.on('banned',function(m){document.body.innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100vh;text-align:center;color:#ff5252;font-size:1.1em;padding:20px;font-family:sans-serif">'+m+'</div>'});
S.on('kicked',function(){location.reload()});S.on('need-reload',function(){location.reload()});
S.on('need-name',function(){document.getElementById('NI').style.display='block';document.getElementById('LW').style.display='none';document.getElementById('LBTN').textContent='Kayit Ol';document.getElementById('LBTN').onclick=function(){doReg()}});
S.on('name-registered',function(n){me=n;S.emit('join')});
function lErr(m){var e=document.getElementById('LE');e.textContent=m;e.style.display='block';setTimeout(function(){e.style.display='none'},3e3)}

S.on('join-success',function(d){me=d.username;myRole=d.role;myUid=d.uid;document.getElementById('LS').style.display='none';document.getElementById('APP').style.display='flex';uBdg();renRooms(d.rooms);renAll(d.onlineUsers);renDML(d.dmList||[]);setupScroll();if(myRole==='host'){document.getElementById('SVB').style.display='';document.getElementById('CRD').style.display='flex';document.getElementById('RPB').style.display='';document.getElementById('ADB').style.display='';document.getElementById('MODBTN').style.display='';S.emit('get-reports')}});

function toggleTheme(){isDark=!isDark;document.body.classList.toggle('light',!isDark)}
function toggleST(){document.getElementById('STSEL').classList.toggle('show')}
function setSt(s){S.emit('set-status',s);document.getElementById('STSEL').classList.remove('show')}
function tSB(){document.getElementById('SBR').classList.toggle('open');document.getElementById('SBB').classList.toggle('show')}
function cSB(){document.getElementById('SBR').classList.remove('open');document.getElementById('SBB').classList.remove('show')}

function renDML(list){var h='';for(var i=0;i<list.length;i++){var d=list[i],ac=activeDM===d.uid?' active':'';h+='<div class="dm-item'+ac+'" onclick="openDM(\''+esc(d.uid)+'\',\''+esc(d.name)+'\')"><span class="dm-dot '+(d.online?'on':'off')+'"></span><div class="dm-info"><div class="dm-nm">'+esc(d.name)+'</div><div class="dm-last">'+esc(d.lastMsg)+'</div></div>';if(d.unread>0)h+='<span class="dm-badge">'+d.unread+'</span>';else h+='<span class="dm-time">'+esc(d.lastTime)+'</span>';h+='</div>'}if(!list.length)h='<div style="padding:8px;font-size:.7em;color:var(--text3);text-align:center">DM yok</div>';document.getElementById('DML').innerHTML=h}
S.on('dm-list',function(l){renDML(l)});

function openDM(uid2,name2){if(uid2===myUid)return;activeDM=uid2;document.getElementById('CE').style.display='none';document.getElementById('RCHAT').classList.remove('show');document.getElementById('DMCHAT').classList.add('show');document.getElementById('DMCHN').textContent=name2;document.getElementById('RT').textContent='DM: '+name2;curRoom=null;S.emit('open-dm',{uid:uid2});cSB()}
function closeDM(){activeDM=null;document.getElementById('DMCHAT').classList.remove('show');document.getElementById('CE').style.display='flex';document.getElementById('RT').textContent='Oda Secin'}
S.on('dm-opened',function(d){activeDM=d.withUid;document.getElementById('DMCHN').textContent=d.withName;document.getElementById('DMCHS').textContent=d.online?'Online':'Offline';var c=document.getElementById('DMCM');c.innerHTML='';for(var i=0;i<d.messages.length;i++)renDMMsg(c,d.messages[i]);c.scrollTop=c.scrollHeight;document.getElementById('DMCI').focus()});
function renDMMsg(c,m){var mine=m.from===myUid;var h='';if(m.type==='image'&&m.mediaFile)h='<div class="mb2"><img class="mimg2" src="/medya/'+m.mediaFile+'" onclick="showFS(this.src)" loading="lazy"></div>';else if(m.type==='video'&&m.mediaFile)h='<div class="mb2"><video class="mvid2" controls playsinline><source src="/medya/'+m.mediaFile+'"></video></div>';else if(m.type==='file'&&m.savedFile)h='<div class="mb2"><div style="display:flex;align-items:center;gap:6px"><span>📄</span><span style="flex:1;font-size:.78em;word-break:break-all">'+esc(m.fileName||'dosya')+'</span><a class="mfil-d" href="/dosya/'+m.savedFile+'?name='+encodeURIComponent(m.fileName||'')+'" download>Indir</a></div></div>';else h='<div class="mb2" style="font-size:.84em">'+esc(m.message||'')+'</div>';c.innerHTML+='<div class="mg '+(mine?'me':'ot')+'">'+h+'<div class="mbot"><span class="mt3">'+m.time+'</span></div></div>'}
function sendDM(){var inp=document.getElementById('DMCI'),m=inp.value.trim();if(!m||!activeDM)return;S.emit('send-dm',{toUid:activeDM,message:m});inp.value='';inp.focus()}
function onDMMedia(inp){if(!inp.files||!inp.files[0]||!activeDM)return;var f=inp.files[0];if(f.size/1048576>50)return;var r=new FileReader();r.onloadend=function(){S.emit('send-dm-media',{toUid:activeDM,file:r.result,fileType:f.type,fileName:f.name})};r.readAsDataURL(f);inp.value=''}
function onDMFile(inp){if(!inp.files||!inp.files[0]||!activeDM)return;var f=inp.files[0];if(f.size/1048576>50)return;var r=new FileReader();r.onloadend=function(){S.emit('send-dm-file',{toUid:activeDM,file:r.result,fileType:f.type,fileName:f.name})};r.readAsDataURL(f);inp.value=''}
S.on('dm-new-msg',function(d){if(activeDM&&(d.from===activeDM||d.to===activeDM)){var c=document.getElementById('DMCM');renDMMsg(c,d);c.scrollTop=c.scrollHeight;if(d.from!==myUid)S.emit('mark-dm-read',{uid:d.from})}});
S.on('dm-notification',function(d){toast('DM: '+d.from,'info');playNotif()});

function renRooms(l){var h='';for(var i=0;i<l.length;i++){var r=l[i],ac=r.id===curRoom?' act':'';h+='<div class="rit'+ac+'" onclick="joinR(\''+r.id+'\')"><span style="color:var(--text3)">#</span><span class="rn">'+esc(r.name)+'</span>';if(r.hasPassword)h+='<span style="font-size:.65em;color:rgba(255,193,7,.5)">&#128274;</span>';h+='<span class="rc">'+r.userCount+'</span>';if(myRole==='host'&&r.id!=='genel')h+='<span class="rx" onclick="event.stopPropagation();showPop(\'delroom\',\''+r.id+'\')">&#10005;</span>';h+='</div>'}document.getElementById('RL').innerHTML=h}
function joinR(id){closeDM();S.emit('join-room',{roomId:id,password:null});cSB()}
function crRoom(){var n=document.getElementById('CRI').value.trim(),p=document.getElementById('CRP').value.trim();if(!n)return;S.emit('create-room',{name:n,password:p||null});document.getElementById('CRI').value='';document.getElementById('CRP').value=''}
document.getElementById('CRI').onkeypress=function(e){if(e.key==='Enter')crRoom()};
S.on('rooms-update',function(l){renRooms(l)});
S.on('need-password',function(d){showPop('password',d.roomId);document.getElementById('PT').textContent=d.roomName;document.getElementById('PP').textContent='Sifre:';document.getElementById('PEX').innerHTML='<input type="password" id="RPINP" placeholder="Sifre...">';document.getElementById('PA').textContent='Giris'});

S.on('room-joined',function(d){
    curRoom=d.roomId;roomsCache=d.messages;curPins=d.pins||[];curPolls=d.polls||[];newMsgCount=0;isAtBottom=true;activeDM=null;
    document.getElementById('RT').textContent='# '+d.roomName;document.getElementById('CE').style.display='none';document.getElementById('DMCHAT').classList.remove('show');document.getElementById('RCHAT').classList.add('show');document.getElementById('IA').classList.add('show');
    if(myRole==='host')document.getElementById('CLB').style.display='';
    var c=document.getElementById('MS');c.innerHTML='';var cm=d.myRole==='host'||d.myRole==='mod';
    var fu=-1;for(var i=0;i<d.messages.length;i++){if(!d.messages[i].readBy||d.messages[i].readBy.indexOf(me)===-1){fu=i;break}}
    var unr=[];for(var j=0;j<d.messages.length;j++){if(j===fu&&fu>0){var dv=document.createElement('div');dv.className='new-divider';dv.textContent='Yeni Mesajlar';c.appendChild(dv)}renMsg(d.messages[j],cm);if(!d.messages[j].readBy||d.messages[j].readBy.indexOf(me)===-1)unr.push(d.messages[j].id)}
    if(fu>0){var divs=c.querySelectorAll('.new-divider');if(divs.length)divs[0].scrollIntoView({behavior:'auto',block:'center'})}else c.scrollTop=c.scrollHeight;
    if(unr.length)S.emit('mark-read',unr);renRU(d.users);
    if(curPins.length){document.getElementById('PINBAR').textContent='📌 '+curPins.length+' sabitlenen';document.getElementById('PINBAR').classList.add('show')}else document.getElementById('PINBAR').classList.remove('show');

    // Anketleri dogru pozisyonda goster
    for(var pi=0;pi<curPolls.length;pi++){
        var poll=curPolls[pi];if(!poll.active)continue;
        var ph=document.getElementById('pollplace-'+poll.id);
        if(ph)renderPollInPlace(ph,poll);
    }

    var items=document.querySelectorAll('.rit');for(var k=0;k<items.length;k++){items[k].classList.remove('act');if((items[k].getAttribute('onclick')||'').indexOf("'"+d.roomId+"'")!==-1)items[k].classList.add('act')}
});
S.on('kicked-from-room',function(m){curRoom=null;document.getElementById('RCHAT').classList.remove('show');document.getElementById('CE').style.display='flex';document.getElementById('RT').textContent='Oda Secin';toast(m,'info')});

function parseMD(t){t=esc(t);t=t.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');t=t.replace(/\*(.+?)\*/g,'<em>$1</em>');t=t.replace(/`(.+?)`/g,'<code>$1</code>');t=t.replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank">$1</a>');t=t.replace(/@(\w+)/g,'<span class="mention-tag">@$1</span>');return t}

function renMsg(d,cm){
    var c=document.getElementById('MS'),mine=d.username===me;var div=document.createElement('div');div.className='mg '+(mine?'me':'ot')+(d.type==='bot'?' bot-msg':'');div.setAttribute('data-id',d.id);var h='';
    if(!mine&&d.type!=='bot'&&d.type!=='poll'){var rt='';if(d.role==='host')rt='<span class="mrt2" style="background:rgba(255,193,7,.12);color:#ffd54f">Y</span>';else if(d.role==='mod')rt='<span class="mrt2" style="background:rgba(33,150,243,.12);color:#64b5f6">M</span>';h+='<div class="ma2">'+esc(abbr(d.username))+rt+'</div>'}
    if(d.replyTo){var ref=findMsg(d.replyTo);if(ref)h+='<div class="reply-ref" onclick="scrollToMsg(\''+d.replyTo+'\')">↩ '+esc(abbr(ref.username))+': '+esc((ref.message||'').substring(0,60))+'</div>'}

    // ANKET MESAJI
    if(d.type==='poll'&&d.pollId){
        h+='<div class="mb2" id="pollplace-'+d.pollId+'" style="max-width:360px;padding:4px"><div style="font-size:.82em;color:var(--text3)">📊 Anket yukleniyor...</div></div>';
    }
    else if(d.type==='image'&&d.mediaFile)h+='<div class="mb2"><img class="mimg2" src="/medya/'+d.mediaFile+'" onclick="showFS(this.src)" loading="lazy"><div style="font-size:.65em;color:var(--text3)">'+d.fileSize+'</div></div>';
    else if(d.type==='video'&&d.mediaFile)h+='<div class="mb2"><video class="mvid2" controls playsinline preload="metadata"><source src="/medya/'+d.mediaFile+'" type="'+(d.mediaType||'video/mp4')+'"></video></div>';
    else if(d.type==='file'&&d.savedFile)h+='<div class="mb2"><div style="display:flex;align-items:center;gap:7px;padding:5px 0"><span style="font-size:1.3em">📄</span><div style="flex:1;min-width:0"><div style="font-size:.8em;word-break:break-all">'+esc(d.fileName||'dosya')+'</div><div style="font-size:.65em;color:var(--text3)">'+d.fileSize+'</div></div><a class="mfil-d" href="/dosya/'+d.savedFile+'?name='+encodeURIComponent(d.fileName||'')+'" download>Indir</a></div></div>';
    else h+='<div class="mb2">'+parseMD(d.message||'')+(d.edited?'<span class="edited-tag">(duzenlendi)</span>':'')+'</div>';

    if(d.type!=='poll'){
        h+='<div class="mbot">';if(cm&&delMode)h+='<input type="checkbox" class="mcb2" data-id="'+d.id+'" onchange="tSel(this)">';h+='<span class="mt3">'+d.time+'</span>';if(mine)h+='<span class="mrd2" id="rd-'+d.id+'">'+rdTxt(d.readBy||[])+'</span>';
        if(d.type!=='bot'){h+='<span class="mact" onclick="setReply(\''+d.id+'\')">↩</span>';h+='<span class="mact" onclick="copyMsg(\''+esc(d.message||'').replace(/'/g,"\\'")+'\')">📋</span>';if(mine&&d.type==='text')h+='<span class="mact" onclick="editMsg(\''+d.id+'\')">✏</span>';if(cm)h+='<span class="mact" onclick="pinMsg(\''+d.id+'\')">📌</span>';if(!mine)h+='<span class="mrp2" onclick="reportMsg(\''+d.id+'\')">⚠</span>'}
        h+='</div>';
    }
    div.innerHTML=h;c.appendChild(div)
}

function findMsg(id){for(var i=0;i<roomsCache.length;i++)if(roomsCache[i].id===id)return roomsCache[i];return null}
function scrollToMsg(id){var el=document.querySelector('[data-id="'+id+'"]');if(el){el.scrollIntoView({behavior:'smooth',block:'center'});el.classList.add('highlight');setTimeout(function(){el.classList.remove('highlight')},2000)}}
function sendMsg(){var inp=document.getElementById('MI'),m=inp.value.trim();if(!m||!curRoom)return;S.emit('send-message',{message:m,replyTo:replyTo?replyTo.id:null});S.emit('stop-typing');inp.value='';inp.focus();cancelReply();document.getElementById('EMOP').classList.remove('show')}
document.getElementById('MI').onkeypress=function(e){if(e.key==='Enter')sendMsg()};

function renderPollInPlace(el,p){
    var total=0;for(var i=0;i<p.options.length;i++)total+=p.options[i].votes.length;
    var myV=-1;for(var j=0;j<p.options.length;j++)if(p.options[j].votes.indexOf(myUid)!==-1)myV=j;
    var h='<div class="poll-card" id="poll-'+p.id+'" style="margin:0"><div class="poll-q">📊 '+esc(p.question)+'</div>';
    for(var k=0;k<p.options.length;k++){var pct=total>0?Math.round(p.options[k].votes.length/total*100):0;h+='<div class="poll-opt'+(k===myV?' voted':'')+'" onclick="votePoll(\''+p.id+'\','+k+')"><div class="poll-bar" style="width:'+pct+'%"></div><span class="poll-text">'+esc(p.options[k].text)+'</span><span class="poll-pct">'+pct+'% ('+p.options[k].votes.length+')</span></div>'}
    h+='<div class="poll-votes">'+total+' oy | '+esc(p.createdBy)+'</div></div>';
    el.innerHTML=h;
}

function renderPoll(p){
    var ph=document.getElementById('pollplace-'+p.id);
    if(ph){renderPollInPlace(ph,p);return}
    var c=document.getElementById('MS');
    var total=0;for(var i=0;i<p.options.length;i++)total+=p.options[i].votes.length;
    var myV=-1;for(var j=0;j<p.options.length;j++)if(p.options[j].votes.indexOf(myUid)!==-1)myV=j;
    var h='<div class="poll-card" id="poll-'+p.id+'"><div class="poll-q">📊 '+esc(p.question)+'</div>';
    for(var k=0;k<p.options.length;k++){var pct=total>0?Math.round(p.options[k].votes.length/total*100):0;h+='<div class="poll-opt'+(k===myV?' voted':'')+'" onclick="votePoll(\''+p.id+'\','+k+')"><div class="poll-bar" style="width:'+pct+'%"></div><span class="poll-text">'+esc(p.options[k].text)+'</span><span class="poll-pct">'+pct+'% ('+p.options[k].votes.length+')</span></div>'}
    h+='<div class="poll-votes">'+total+' oy | '+esc(p.createdBy)+'</div></div>';
    var div=document.createElement('div');div.innerHTML=h;c.appendChild(div.firstChild);c.scrollTop=c.scrollHeight;
}

S.on('role-changed',function(d){myRole=d.role;uBdg();if(myRole==='host'){document.getElementById('SVB').style.display='';document.getElementById('CLB').style.display='';document.getElementById('CRD').style.display='flex';document.getElementById('RPB').style.display='';document.getElementById('ADB').style.display='';document.getElementById('MODBTN').style.display='';S.emit('get-reports')}toast('Rol: '+(myRole==='host'?'Yonetici':myRole==='mod'?'Moderator':'Kullanici'),'info')});
function uBdg(){var b=document.getElementById('MBG');if(myRole==='host'){b.className='bdg bh';b.textContent='YNT'}else if(myRole==='mod'){b.className='bdg bm';b.textContent='MOD'}else{b.className='bdg bu';b.textContent=''}}
S.on('save-status',function(d){toast(d.auto?'Oto kayit':'Kaydedildi!','success')});
function showPop(type,extra){popAct={type:type,extra:extra};document.getElementById('PEX').innerHTML='';document.getElementById('PA').style.display='';document.getElementById('PA').className='pd3';document.getElementById('PA').textContent='Tamam';if(type==='clear'){document.getElementById('PT').textContent='Sifirla';document.getElementById('PP').textContent='Silinecek.';document.getElementById('PA').className='pdg'}else if(type==='delroom'){document.getElementById('PT').textContent='Oda Sil';document.getElementById('PP').textContent='Silinecek.';document.getElementById('PA').className='pdg'}document.getElementById('OV').classList.add('show')}
function hidePop(){document.getElementById('OV').classList.remove('show');popAct=null}
function doPop(){if(!popAct){hidePop();return}if(popAct.type==='clear')S.emit('clear-room',curRoom);else if(popAct.type==='delroom')S.emit('delete-room',popAct.extra);else if(popAct.type==='password'){var i=document.getElementById('RPINP');S.emit('join-room',{roomId:popAct.extra,password:i?i.value.trim():''})}else if(popAct.type==='report'){var r=document.getElementById('RPREASON');if(!r||!r.value.trim()){toast('Neden!','error');return}S.emit('report-message',{msgId:popAct.extra,reason:r.value.trim()})}else if(popAct.type==='edit'){var t=document.getElementById('EDTXT');if(!t||!t.value.trim())return;S.emit('edit-message',{msgId:popAct.extra,newText:t.value.trim()})}hidePop()}
S.on('user-typing',function(u){typU.add(u);uTyp()});S.on('user-stop-typing',function(u){typU.delete(u);uTyp()});
function uTyp(){var el=document.getElementById('TP'),a=Array.from(typU);el.textContent=a.length?a.join(', ')+' yaziyor...':''}
S.on('msg-error',function(m){toast(m,'error')});S.on('msg-success',function(m){toast(m,'success')});S.on('system-toast',function(d){toast(d.text,d.type)});
function addSys(t){var c=document.getElementById('MS');if(!c)return;var d=document.createElement('div');d.className='sys3';d.textContent='- '+t+' -';c.appendChild(d);c.scrollTop=c.scrollHeight}
function rdTxt(rb){var r=[];for(var i=0;i<rb.length;i++)if(rb[i]!==me)r.push(rb[i]);if(!r.length)return'✓';var s=[];for(var j=0;j<r.length&&j<3;j++)s.push(abbr(r[j]));return s.join(', ')+(r.length>3?' +'+(r.length-3):'')+' ✓✓'}
function abbr(n){if(!n)return'?';n=n.trim();return n.length<=3?n:n.substring(0,2)+'.'}
function esc(t){var d=document.createElement('div');d.textContent=t;return d.innerHTML}
function playNotif(){try{var a=document.getElementById('NSND');a.currentTime=0;a.volume=0.3;a.play().catch(function(){})}catch(e){}}
function toast(m,type){var t=document.createElement('div');t.className='tt2 '+(type||'info');t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.style.animation='to3 .4s forwards';setTimeout(function(){t.remove()},400)},3e3)}
</script>
